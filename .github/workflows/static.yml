name: static

# Database-free gate: typecheck, lint, source-lock verification, the fast unit
# lanes, and the production build. This is the check that must be green on
# every pull request; the acceptance job needs Postgres and Chromium and runs
# beside it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    # Cold Turbopack + TypeScript builds exceed the runner default of 4 GiB.
    container:
      image: docker.gitea.com/runner-images@sha256:58ea92624c7c09582e05594d95488331045053d3a3f34cf09649f2a32313a614
      options: --memory=6g --memory-swap=6g --cpus=2
    timeout-minutes: 20
    steps:
      - name: Ensure Git LFS is available
        run: |
          if ! command -v git-lfs >/dev/null 2>&1; then
            apt-get update
            apt-get install --yes --no-install-recommends git-lfs
          fi
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Verify LFS authentication boundaries
        run: python3 scripts/test-ci-lfs-checkout.py
      - name: Fetch pinned LFS sources without conflicting headers
        env:
          CI_LFS_TOKEN: ${{ github.token }}
        run: bash scripts/ci-lfs-checkout.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run data:verify
      - run: npm run test:fast
      - run: npm run build
        env:
          # Leave room for Turbopack and worker processes in the 6 GiB job.
          NODE_OPTIONS: --max-old-space-size=2048
